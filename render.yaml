services:
  - type: web
    name: sentiment-pulse-app
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentiment-pulse-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://sentiment-pulse-app.onrender.com"
      - key: APP_BASE_URL
        value: "https://sentiment-pulse-app.onrender.com"
      - key: MAX_IMPORT_FILE_SIZE_BYTES
        value: "104857600"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"
    disk:
      name: sentiment-pulse-data
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: sentiment-pulse-db
    plan: free
    databaseName: sentiment_pulse
    user: sentiment_admin
